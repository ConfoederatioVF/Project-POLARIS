  <text x="350" y="123" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Sakha / Yakuts (35 Central Volosts & Vilyuy, III-2/III-1)</text><rect x="360" y="111" width="700.0" height="18" rx="2" fill="#15803d" opacity="0.28" stroke="#15803d" stroke-width="1"/><rect x="360" y="111" width="569.4" height="18" rx="2" fill="#15803d"/><text x="1067.0" y="124" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">28,47k (up to 35,0k)</text><text x="350" y="154" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Buryats (Bulagat, Ekhirit, Khori, Tabangut, II-1)</text><rect x="360" y="142" width="600.0" height="18" rx="2" fill="#b45309" opacity="0.28" stroke="#b45309" stroke-width="1"/><rect x="360" y="142" width="546.0" height="18" rx="2" fill="#b45309"/><text x="967.0" y="155" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">27,30k (up to 30,0k)</text><text x="350" y="185" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Evenks & Evens (Tungus & Lamut across II, III, IV)</text><rect x="360" y="173" width="570.0" height="18" rx="2" fill="#0f766e" opacity="0.28" stroke="#0f766e" stroke-width="1"/><rect x="360" y="173" width="488.0" height="18" rx="2" fill="#0f766e"/><text x="937.0" y="186" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">24,40k (up to 28,5k)</text><text x="350" y="216" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Duchers (Middle Amur Plough Agriculturalists, IV-1)</text><rect x="360" y="204" width="320.0" height="18" rx="2" fill="#4338ca" opacity="0.28" stroke="#4338ca" stroke-width="1"/><rect x="360" y="204" width="280.0" height="18" rx="2" fill="#4338ca"/><text x="687.0" y="217" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">14,00k (up to 16,0k)</text><text x="350" y="247" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Itelmens / Kamchadals (>120 Riverine Ostrozhki, IV-2)</text><rect x="360" y="235" width="370.0" height="18" rx="2" fill="#0284c7" opacity="0.28" stroke="#0284c7" stroke-width="1"/><rect x="360" y="235" width="253.6" height="18" rx="2" fill="#0284c7"/><text x="737.0" y="248" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">12,68k (up to 18,5k)</text><text x="350" y="278" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Khongorai Yenisei Kyrgyz & Kyshtyms (4 Uluses, II-2)</text><rect x="360" y="266" width="300.0" height="18" rx="2" fill="#d97706" opacity="0.28" stroke="#d97706" stroke-width="1"/><rect x="360" y="266" width="240.0" height="18" rx="2" fill="#d97706"/><text x="667.0" y="279" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">12,00k (up to 15,0k)</text><text x="350" y="309" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Koryaks (Nymylan Coastal & Chavchuven Reindeer, IV-3/IV-2)</text><rect x="360" y="297" width="250.0" height="18" rx="2" fill="#7c3aed" opacity="0.28" stroke="#7c3aed" stroke-width="1"/><rect x="360" y="297" width="215.6" height="18" rx="2" fill="#7c3aed"/><text x="617.0" y="310" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">10,78k (up to 12,5k)</text><text x="350" y="340" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Daurs (Upper/Middle Amur & Zeya Fortified Towns, IV-1)</text><rect x="360" y="328" width="230.0" height="18" rx="2" fill="#4338ca" opacity="0.28" stroke="#4338ca" stroke-width="1"/><rect x="360" y="328" width="196.0" height="18" rx="2" fill="#4338ca"/><text x="597.0" y="341" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">9,80k (up to 11,5k)</text><text x="350" y="371" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Chukchi / Luorawetlan (Tundra & Coastal, IV-3)</text><rect x="360" y="359" width="160.0" height="18" rx="2" fill="#7c3aed" opacity="0.28" stroke="#7c3aed" stroke-width="1"/><rect x="360" y="359" width="130.0" height="18" rx="2" fill="#7c3aed"/><text x="527.0" y="372" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">6,50k (up to 8,0k)</text><text x="350" y="402" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Nivkhs / Gilyaks (Lower Amur Liman & N. Sakhalin, IV-1/IV-2)</text><rect x="360" y="390" width="140.0" height="18" rx="2" fill="#4338ca" opacity="0.28" stroke="#4338ca" stroke-width="1"/><rect x="360" y="390" width="122.0" height="18" rx="2" fill="#4338ca"/><text x="507.0" y="403" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">6,10k (up to 7,0k)</text><text x="350" y="433" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Natki / Nanai, Ulchi, Udege & Oroch (Lower Amur/Ussuri, IV-1)</text><rect x="360" y="421" width="130.0" height="18" rx="2" fill="#4338ca" opacity="0.28" stroke="#4338ca" stroke-width="1"/><rect x="360" y="421" width="108.0" height="18" rx="2" fill="#4338ca"/><text x="497.0" y="434" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">5,40k (up to 6,5k)</text><text x="350" y="464" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Yeniseian Peoples (Ket, Kott, Arin, Assan, Pumpokol, II-3/II-2)</text><rect x="360" y="452" width="120.0" height="18" rx="2" fill="#b45309" opacity="0.28" stroke="#b45309" stroke-width="1"/><rect x="360" y="452" width="105.0" height="18" rx="2" fill="#b45309"/><text x="487.0" y="465" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">5,25k (up to 6,0k)</text><text x="350" y="495" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Yukaghirs & Chuvans (Yana, Indigirka, Kolyma, Anadyr, III-3/IV-3)</text><rect x="360" y="483" width="116.0" height="18" rx="2" fill="#15803d" opacity="0.28" stroke="#15803d" stroke-width="1"/><rect x="360" y="483" width="95.4" height="18" rx="2" fill="#15803d"/><text x="483.0" y="496" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">4,77k (up to 5,8k)</text><text x="350" y="526" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Tuvans (Todzha, Maady, Sayan, Mingat, II-2)</text><rect x="360" y="514" width="120.0" height="18" rx="2" fill="#d97706" opacity="0.28" stroke="#d97706" stroke-width="1"/><rect x="360" y="514" width="90.0" height="18" rx="2" fill="#d97706"/><text x="487.0" y="527" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">4,50k (up to 6,0k)</text><text x="350" y="557" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Samoyeds of II-3 (Nganasan 1,28k, Enets 1,15k, E. Nenets 2,02k)</text><rect x="360" y="545" width="100.0" height="18" rx="2" fill="#b45309" opacity="0.28" stroke="#b45309" stroke-width="1"/><rect x="360" y="545" width="89.0" height="18" rx="2" fill="#b45309"/><text x="467.0" y="558" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">4,45k (up to 5,0k)</text><text x="350" y="588" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Sakhalin & Kuril Ainu (Southern Sakhalin & Kurils, IV-2)</text><rect x="360" y="576" width="90.0" height="18" rx="2" fill="#0284c7" opacity="0.28" stroke="#0284c7" stroke-width="1"/><rect x="360" y="576" width="76.0" height="18" rx="2" fill="#0284c7"/><text x="457.0" y="589" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">3,80k (up to 4,5k)</text><text x="350" y="619" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Siberian Yupik / Eskimos (Ekven, Uelen, Naukan, Chaplino, IV-3)</text><rect x="360" y="607" width="64.0" height="18" rx="2" fill="#7c3aed" opacity="0.28" stroke="#7c3aed" stroke-width="1"/><rect x="360" y="607" width="52.0" height="18" rx="2" fill="#7c3aed"/><text x="431.0" y="620" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">2,60k (up to 3,2k)</text>
