  <text x="30" y="32" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Figure 4: 17th-Century Indigenous Ethno-Demographic Composition of Yenisei, Lena-Kolyma and Pacific Siberia</text>
  <text x="30" y="52" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">Solid bars = Dolgikh (1960) archival yasak baseline (Total = 187,65k); Shaded extensions = Pre-epidemic / Pre-deportation ceiling (up to 222,0k)</text>

